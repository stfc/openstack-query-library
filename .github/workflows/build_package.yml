name: build and release openstackquery package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release - make sure its same as setup.py"
        required: true
      changelog:
        description: "Release changelog description"
        required: false

jobs:
  release:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        python-version: ["3.8"]

    steps:
      - name: Checkout code
        uses:actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses:actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/

  publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses:actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1 
        with:
          path: dist

      - name: Generate Changelog
        id: changelog
        run: |
          if [ -z "${{ github.event.inputs.changelog }}" ]; then
            echo "changelog=Release version ${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "changelog=${{ github.event.inputs.changelog }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag
        uses: EndBug/latest-tag@8fcae8848c1e23fd8212258f69a9619bc62cad67
        with:
          tag-name: v${{ github.event.inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda #v3.0.0
        with:
          tag_name: v${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist/**/*.whl
            dist/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
